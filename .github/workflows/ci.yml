# Backend tests and frontend lint/build on every push to main and every
# PR. Checked out next to platform-core (sibling paths, as in GoalNexa's
# apps/) because this module installs platform-core's backend editable
# and depends on its frontend as a file: package - its main branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform-mcp
      - uses: actions/checkout@v4
        with:
          repository: PMNexa/platform-core
          path: platform-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -e . -e ../../platform-core/backend
        working-directory: platform-mcp/backend
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        working-directory: platform-mcp/backend
      - name: Test
        run: python manage.py test --settings=config.test_settings
        working-directory: platform-mcp/backend
        env:
          DJANGO_ALLOWED_HOSTS: localhost,testserver

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform-mcp
      - uses: actions/checkout@v4
        with:
          repository: PMNexa/platform-core
          path: platform-core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install platform-core, a file dependency
        run: npm ci
        working-directory: platform-core/frontend
      - run: npm ci
        working-directory: platform-mcp/frontend
      - run: npm run lint
        working-directory: platform-mcp/frontend
      - run: npm run build
        working-directory: platform-mcp/frontend
